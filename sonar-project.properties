# SonarCloud / SonarQube project configuration.
#
# IMPORTANT: C/C++ is NOT supported by SonarCloud "Automatic Analysis". Turn it OFF
# (SonarCloud project -> Administration -> Analysis Method -> disable Automatic
# Analysis) or the CI-based scan below is rejected as a conflicting analysis.
#
# The project key is NOT SonarCloud's GitHub-import default (`<owner>_<repo>`) - this project
# publishes under the bare name. The README quality-gate badge builds its URL from this key, so
# the two move together; a mismatch renders the badge as "project not found" rather than failing
# the scan, which is why it can drift unnoticed.
sonar.projectKey=ProtoCore
sonar.organization=dstroy0
sonar.projectName=ProtoCore

# src/ is the library. tools/ is the repo's own Python: the CI checkers, the generators, and the
# dev tooling, which were outside sonar.sources entirely so those files were never analyzed. The
# side-channel analysis engines and the pentest driver live under test/ and are indexed by
# sonar.tests below; naming them here too would index them twice.
sonar.sources=src,tools
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Analyze ALL of src/ recursively. This overrides a stale instance-level
# sonar.inclusions=src/* (NON-recursive) that had collapsed the whole analysis to
# the three files directly in src/ - so coverage was measured against one file
# (the bogus "68%") and every nested codec/service was invisible. Must stay src/**.
#
# tools/ is narrowed to *.py on purpose: it also carries shell and rig firmware that the
# compilation database does not describe, so admitting it would hand the C/C++ analyzer files it
# cannot configure. C/C++ analysis stays exactly what it was: src/**.
sonar.inclusions=src/**,tools/**/*.py

# The scanner defaults to "compatible with all Python 3 versions", which suppresses any
# version-specific rule. Measured floor across these trees is 3.8 syntax (one walrus, no match
# statement, no PEP 604 unions, no tomllib); CI installs 3.x, which resolves to the newest
# release. Declaring the range keeps a script that has to run on a contributor's older
# interpreter honest, instead of silently assuming everyone is on the newest.
sonar.python.version=3.9, 3.10, 3.11, 3.12, 3.13, 3.14

# The C/C++ analyzer needs a compilation database. It is generated in CI by
# tools/ci_tooling/sonar/gen_compiledb.sh (merged across every native env so feature-gated
# files are covered) and is git-ignored (machine-specific paths).
sonar.cfamily.compile-commands=compile_commands.json

# Coverage: the native Unity tests run with gcov instrumentation, gcovr emits one tracefile per env,
# and gcovr unions them into this SonarQube generic-coverage report with --add-tracefile (src/ only,
# nothing excluded). It is COMMITTED, and regenerated by the whole-matrix run - an affected-only run
# measures a subset of src/ and leaves it alone.
sonar.coverageReportPaths=test/coverage.xml

# Generated string-literal asset headers and the web wizard are not hand-written.
sonar.exclusions=src/network_drivers/application/web_assets.*,src/network_drivers/application/binary_asset_blobs.*,web_assets/**

# Per-board default/tuning headers duplicate each other by design: every chip variant mirrors the
# same set of knobs with different values, so copy-paste detection flags them as false positives.
sonar.cpd.exclusions=core_setup/board_profiles/**

# ---------------------------------------------------------------------------
# Rule suppressions - version-controlled, reviewable (equivalent to disabling a
# rule in the quality profile). These are NOT bugs waived away: each rule below
# conflicts with a DELIBERATE, DOCUMENTED design constraint of this library, so
# it fires on correct-by-design code. Genuine findings (cognitive complexity
# S3776, deep nesting S134, const-correctness S5817, dead code S125, security
# hotspots) are intentionally NOT suppressed.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=carr,gmut,fptr,cmac,wbnd,hdr,mpar,vptr,rfor,rtyp,dstruct,jstr,aesctx,tdef,mord,sizeu,vlog,cfginc,ntrdecl,ntrloop,ntrjump,ntrnest,ntrcplx,ntrasgn

# S5945 "use std::array/std::vector instead of a C-style array": this is a no-heap,
# no-stdlib, deterministic embedded library (see docs; <cstdlib>/STL containers are
# banned in src/). Fixed C arrays + static pools ARE the design.
sonar.issue.ignore.multicriteria.carr.ruleKey=cpp:S5945
sonar.issue.ignore.multicriteria.carr.resourceKey=**/*

# S5421 "global variables should be const": the owner-context architecture keeps each
# subsystem's mutable state in ONE named, internal-linkage owned <Name>Ctx instance
# (enforced by tools/ci_tooling/check/check_owned_context.py). Those owners are mutable by design.
sonar.issue.ignore.multicriteria.gmut.ruleKey=cpp:S5421
sonar.issue.ignore.multicriteria.gmut.resourceKey=**/*

# S5205 "replace this function pointer with a template parameter or std::function":
# std::function allocates; callbacks here are plain C function pointers by design.
sonar.issue.ignore.multicriteria.fptr.ruleKey=cpp:S5205
sonar.issue.ignore.multicriteria.fptr.resourceKey=**/*

# S5028 "replace this macro by const/constexpr/enum": named object-like #define constants
# are a deliberate library-wide convention, not just in protocore_config.h (whose defaults are
# also preprocessor-overridable, #ifndef X #define X ... #endif, which constexpr cannot be).
# The same idiom names every protocol wire constant (LSV2/VXI11/IKEv2/SCPI/HiSLIP commands
# and payload types, DSCP code points, packet/message tags) and every derived sizing macro -
# zero-overhead, header-only, usable in array bounds and switch labels. S5028 flags all of
# them without distinguishing an anonymous magic number, so it does not fit this codebase;
# suppressed project-wide like the other embedded-convention rules above (S5945/S5421/S5205).
sonar.issue.ignore.multicriteria.cmac.ruleKey=cpp:S5028
sonar.issue.ignore.multicriteria.cmac.resourceKey=**/*

# S3519 "memory copy overflows the destination buffer": FALSE POSITIVE on the bounded
# Writer in tls13_msg.cpp - every memcpy is guarded by pos<=cap && n<=cap-pos (no
# underflow, no pos+n wrap), but buf/cap are separate params so the analyzer cannot
# prove buf has cap bytes. Scoped to that one file (its writer is entirely this pattern).
sonar.issue.ignore.multicriteria.wbnd.ruleKey=cpp:S3519
sonar.issue.ignore.multicriteria.wbnd.resourceKey=**/tls13_msg.c

# S125 "remove this commented-out code": FALSE POSITIVE on the protocore_config.h section
# headers ("// -- Name (services/x) --") - the parens/slashes trip the commented-code
# heuristic. They are documentation that organizes 100+ config macros, not dead code.
sonar.issue.ignore.multicriteria.hdr.ruleKey=cpp:S125
sonar.issue.ignore.multicriteria.hdr.resourceKey=**/protocore_config.h

# S107 "function has too many parameters": the flat wire codecs (mqtt_build_publish,
# coap/dns/snmp build+parse, ...) take the message fields as positional args by design - a
# no-heap deterministic library avoids per-call option structs. Same flat-C-API stance as the
# S5205 function-pointers above; a codec taking 8-9 wire fields is correct, not a smell.
sonar.issue.ignore.multicriteria.mpar.ruleKey=cpp:S107
sonar.issue.ignore.multicriteria.mpar.resourceKey=**/*

# S5008 "replace this void* with a meaningful type": the callback seams pass an opaque
# `void *ctx` (smtp/coap/dns send-recv, resource handlers, ...) - a plain-C callback design
# (cf. S5205), where a typed context would force templates/std::function, both banned here (no
# allocation, C ABI). The void* IS the interface.
sonar.issue.ignore.multicriteria.vptr.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.vptr.resourceKey=**/*

# S5566 "change this raw for-loop to a range-for": this C-leaning library uses explicit
# index-based loops uniformly (zero range-for across src/). Over a fixed C array range-for is
# identical codegen (no performance gain), and adopting it for only the subset the analyzer
# recognizes would fragment the deliberate style. Index loops ARE the design.
sonar.issue.ignore.multicriteria.rfor.ruleKey=cpp:S5566
sonar.issue.ignore.multicriteria.rfor.resourceKey=**/*

# S5827 "replace the redundant type with auto": the `auto` keyword is banned in src/ - every
# type is spelled out explicitly (same explicit-C stance as the index loops above). This rule's
# only fix is to introduce `auto`, which the library's style forbids.
sonar.issue.ignore.multicriteria.rtyp.ruleKey=cpp:S5827
sonar.issue.ignore.multicriteria.rtyp.resourceKey=**/*

# S1820 "refactor this structure to have fewer than 20 fields": DtlsConn is the single owned
# per-connection state aggregate for a DTLS 1.3 server handshake (keys/seqnos/replay windows per
# epoch, CID, PTO timers, transcript hash, peer address). A flat no-heap connection struct - all
# state in one named owner - IS the owner-context design (tools/ci_tooling/check/check_owned_context.py); splitting
# it into sub-structs would ripple through every c->field access for no design gain. Scoped to it.
sonar.issue.ignore.multicriteria.dstruct.ruleKey=cpp:S1820
sonar.issue.ignore.multicriteria.dstruct.resourceKey=**/dtls_conn.h

# S3628 "convert this string literal to a raw string literal": escaped-quote JSON string literals
# ("{\"name\":\"") are the uniform style across src/ (196 instances, zero raw strings). Adopting
# R"(...)" for only the subset the analyzer flags would fragment the style for no gain; the escaped
# form IS the design (same explicit stance as the index loops / no-auto above).
sonar.issue.ignore.multicriteria.jstr.ruleKey=cpp:S3628
sonar.issue.ignore.multicriteria.jstr.resourceKey=**/*

# S5416 "using should be preferred to typedef": src/ has 89 typedefs and 76 of them are C
# function-pointer callback types (Handler, SshPasswordCb, pc_hotswap_mount, ...); the rest are plain-C
# type/struct aliases in the crypto primitives and the arena. They are the public C-style API surface,
# the same plain-C stance already documented for S5205 (function pointers) and S5008 (void* context).
# The analyzer only sees the subset of files in the merged compile database, so it flags 12 of the 89 -
# converting exactly those would fragment one uniform convention into two for no gain.
sonar.issue.ignore.multicriteria.tdef.ruleKey=cpp:S5416
sonar.issue.ignore.multicriteria.tdef.resourceKey=**/*

# S8417 "use memory_order_seq_cst": the lock-free seams (tcp.cpp conn free-slot bitmask, worker.cpp run
# flag, ring.h) pick their orders deliberately and document the pairing at each site - the accept path's
# acquire load pairs with the release store that publishes a cleaned slot, and the observability counters
# are relaxed because they are statistics, not synchronization. Forcing seq_cst would put a full barrier
# on the per-accept hot path this replaced a linear scan to speed up (measured 20 vs 71 cyc on the S3).
sonar.issue.ignore.multicriteria.mord.ruleKey=cpp:S8417
sonar.issue.ignore.multicriteria.mord.resourceKey=**/*

# S959 "put this #undef in the file where the macro is defined": board_drivers/board_profiles/derived_sizing.h exists
# precisely to raise sizing floors that protocore_config.h (or a board profile, or a build flag) already set -
# lifting RX_BUF_SIZE to hold a full TCP window when streaming is compiled in, and so on. #undef + #define
# is the only preprocessor mechanism for that, and doing it in the defining file is impossible: the floor
# depends on which PC_ENABLE_* features are on, which is not known until every default has been seen.
sonar.issue.ignore.multicriteria.sizeu.ruleKey=cpp:S959
sonar.issue.ignore.multicriteria.sizeu.resourceKey=**/derived_sizing.h

# S923 "remove use of ellipsis notation": pc_log_printf is the library's printf-style logging entry point.
# A format-string logger has to take varargs and forward them to vsnprintf; there is no variadic-template
# alternative here (templates would instantiate per call site in a no-heap, size-constrained library).
sonar.issue.ignore.multicriteria.vlog.ruleKey=cpp:S923
sonar.issue.ignore.multicriteria.vlog.resourceKey=**/log.c

# S954 "move this #include to the top of the file": protocore_config.h includes board_drivers/board_profiles/derived_sizing.h
# as its LAST line on purpose (see S959 above) - the derived floors can only be computed once every
# feature flag and every default in this file has been defined. Moving it to the top inverts that and the
# floors silently evaluate against undefined macros. Scoped to protocore_config.h; genuine mid-file includes
# elsewhere are fixed, not waived.
sonar.issue.ignore.multicriteria.cfginc.ruleKey=cpp:S954
sonar.issue.ignore.multicriteria.cfginc.resourceKey=**/protocore_config.h

# ---------------------------------------------------------------------------
# sntrup761.cpp: VENDORED reference code. The KEM is ported from OpenSSH's embedded sntrup761.c,
# which in turn vendors djbsort (its own header says "from supercop-20240808/crypto_sort/int32/
# portable4/sort.c") - so most of this file is third-party code twice removed from this project.
# It is verified byte-exact against the OpenSSH reference in both directions (keypair/enc/dec, all
# five direction combinations), and the ONLY practical way to re-audit it when upstream publishes a
# new sntrup revision is to diff it against upstream. Restyling inherited lines destroys that.
#
# The split was measured, not assumed: of the 39 findings in this file, ~34 land on lines that are
# verbatim upstream - crypto_sort_int32 (the S3776/S134/S924 cluster), R3_recip / Rq_recip3 (the
# S1121 + S5955 "loop" sites), and 22 of the 26 S1659 multi-declarators. The 4 S1659 sites that are
# genuinely project-written (the pc_sntrup761_* wrappers) are FIXED, not waived, as are the two
# S1905 redundant casts in the project-written mask helpers. These six entries cover the remainder.
#
# House style elsewhere is decisively one-declaration-per-line (6369 single vs 198 multi across
# src/, 97%), so this is a carve-out for vendored code, NOT a relaxation of the convention.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria.ntrdecl.ruleKey=cpp:S1659
sonar.issue.ignore.multicriteria.ntrdecl.resourceKey=**/sntrup761.c
sonar.issue.ignore.multicriteria.ntrloop.ruleKey=cpp:S5955
sonar.issue.ignore.multicriteria.ntrloop.resourceKey=**/sntrup761.c
sonar.issue.ignore.multicriteria.ntrjump.ruleKey=cpp:S924
sonar.issue.ignore.multicriteria.ntrjump.resourceKey=**/sntrup761.c
sonar.issue.ignore.multicriteria.ntrnest.ruleKey=cpp:S134
sonar.issue.ignore.multicriteria.ntrnest.resourceKey=**/sntrup761.c
sonar.issue.ignore.multicriteria.ntrcplx.ruleKey=cpp:S3776
sonar.issue.ignore.multicriteria.ntrcplx.resourceKey=**/sntrup761.c
sonar.issue.ignore.multicriteria.ntrasgn.ruleKey=cpp:S1121
sonar.issue.ignore.multicriteria.ntrasgn.resourceKey=**/sntrup761.c

# S995 in ssh_aesgcm.cpp: aes256_ecb and the GCM helpers (gctr/gcm_core) take a non-const
# SshAesGcmCtx* on purpose. On the ARDUINO path aes256_ecb wraps mbedtls_aes_crypt_ecb(), whose
# mbedtls_aes_context is non-const, so const-propagating the ctx compiles on the native software-AES
# path but breaks the mbedtls path (dual-core build). Sonar only sees the native side; the pointer
# must stay non-const for portability.
sonar.issue.ignore.multicriteria.aesctx.ruleKey=cpp:S995
sonar.issue.ignore.multicriteria.aesctx.resourceKey=**/ssh_aesgcm.cpp
