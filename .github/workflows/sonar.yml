name: SonarCloud

# The SonarCloud C/C++ + Python analysis, on its own. It used to be the last step of Test & Analyze,
# behind env selection, the compile database, the whole test matrix and a Prettier pass; any of those
# failing skipped the scan, so a broken tooling path or a red suite silently meant no analysis at all.
#
# Nothing here depends on the suite. The scan needs two inputs:
#   * compile_commands.json - generated below (every native env merged, so feature-gated files are
#     covered), because C/C++ analysis is not possible without a compilation database;
#   * test/coverage.xml     - COMMITTED, and regenerated by Test & Analyze's whole-matrix runs.
# So a red matrix still gets analyzed, against the last coverage that was actually measured.
#
# SonarCloud "Automatic Analysis" does not support C/C++ and must stay OFF in the project settings,
# or this scan is rejected as a conflicting analysis. Configuration lives in sonar-project.properties.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    # A fork PR has no access to SONAR_TOKEN, so the scan cannot authenticate; skip rather than fail.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      # With no SONAR_TOKEN configured the steps below are skipped and the job is a quick green.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: SonarCloud attributes findings to new code by commit date

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # The compile database is one `pio run -t compiledb` per native env, so the toolchain download
      # dominates a cold run. Keyed on platformio.ini, which is what changes the env set.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: sonar-${{ hashFiles('platformio.ini') }}
          restore-keys: sonar-

      - name: Install PlatformIO
        if: ${{ env.SONAR_TOKEN != '' }}
        run: pip install --upgrade platformio

      # Full mode: every native env, merged. This job commits nothing, so it does not overlay onto
      # the committed test/compile_commands.json baseline - it builds the database whole each time.
      - name: Generate merged compile_commands.json
        if: ${{ env.SONAR_TOKEN != '' }}
        run: bash tools/ci_tooling/sonar/gen_compiledb.sh

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io
