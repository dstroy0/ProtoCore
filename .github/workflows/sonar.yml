name: SonarCloud

# The SonarCloud C/C++ + Python analysis, on its own. It does not run behind the test matrix, so a broken
# tooling path or a red suite does not skip the scan.
#
# Nothing here depends on the suite. The scan needs two inputs:
#   * compile_commands.json - generated below (every native env merged, so feature-gated files are
#     covered), because C/C++ analysis is not possible without a compilation database;
#   * test/coverage.xml     - COMMITTED, and regenerated by Test & Analyze's whole-matrix runs.
# So a red matrix still gets analyzed, against the last coverage that was actually measured.
#
# SonarCloud "Automatic Analysis" does not support C/C++ and must stay OFF in the project settings,
# or this scan is rejected as a conflicting analysis. Configuration lives in sonar-project.properties.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    # A fork PR has no access to SONAR_TOKEN, so the scan cannot authenticate; skip rather than fail.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      # With no SONAR_TOKEN configured the steps below are skipped and the job is a quick green.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # include/MMgr: src/ builds against it
          fetch-depth: 0 # full history: SonarCloud attributes findings to new code by commit date

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # PlatformIO only fetches the host build's libraries here (Unity, littlefs); the envs are
      # CMake targets and the compile database comes from the CMake configure.
      - name: Install PlatformIO and the host libraries
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          pip install --upgrade platformio
          python3 test/harness.py libs

      # Every native env, merged. This job commits nothing, so it does not overlay onto the committed
      # test/compile_commands.json baseline - it builds the database whole each time.
      - name: Generate merged compile_commands.json
        if: ${{ env.SONAR_TOKEN != '' }}
        run: bash tools/ci_tooling/sonar/gen_compiledb.sh

      # The committed report can name lines that a later commit removed, and the coverage sensor then refuses the
      # whole report. This drops each line past the end of its file, and each file that is gone.
      - name: Fit the coverage report to the checkout
        if: ${{ env.SONAR_TOKEN != '' }}
        run: python3 tools/ci_tooling/sonar/trim_coverage.py

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io
