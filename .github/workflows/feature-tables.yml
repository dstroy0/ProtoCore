name: Feature Tables

on:
  push:
    branches: [main]

# Do not cancel in progress - let the commit complete cleanly.
concurrency:
  group: feature-tables-${{ github.ref }}
  cancel-in-progress: false

jobs:
  feature-tables:
    name: Regenerate feature tables
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Authenticate with the automatic-actions deploy key so the bot commit
          # pushes over SSH past the protected-main ruleset (same as the changelog).
          ssh-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Regenerate README.md / docs/README.md from docs/FEATURES.md so the tables
      # never drift - no contributor has to remember to run the generator.
      - name: Regenerate tables from FEATURES.md
        run: python -m tools.ci_tooling.generate.gen_feature_tables

      # Regenerate the source-derived reference sections of docs/README.md (feature-flag
      # defaults, tunable constants, the full source tree, per-feature build footprint) from
      # protocore_config.h / src / docs/footprints.json so they never drift from the code.
      - name: Regenerate README source-derived sections
        run: python -m tools.ci_tooling.generate.gen_readme_sections

      # Regenerate the interactive build configurator from protocore_config.h so it
      # always reflects the current feature flags, tuning knobs, and dependencies.
      - name: Regenerate configurator from protocore_config.h
        run: python -m tools.ci_tooling.generate.gen_configurator

      # Regenerate the build-flag dependency graph from the #error/#if guards in
      # protocore_config.h so the README diagram tracks the guards the compiler enforces.
      - name: Regenerate build-flag dependency graph
        run: python -m tools.ci_tooling.generate.gen_flag_deps

      # Regenerate the core API-flow graph from the public API + protocol registry so the
      # README diagram tracks the actual surface and layer wiring.
      - name: Regenerate core API-flow graph
        run: python -m tools.ci_tooling.generate.gen_api_flow

      # Render each diagram .mmd (written by the two generators above) to a light + dark PNG. The
      # READMEs / docs embed the PNGs via <picture> instead of a live mermaid fence, so the diagrams
      # show in the GitHub web UI, the GitHub mobile app, AND Doxygen (the app + Doxygen do not render
      # mermaid). mermaid-cli pulls its own Chromium; the render script passes --no-sandbox for CI.
      - name: Render diagram PNGs
        run: |
          npm install -g @mermaid-js/mermaid-cli@11
          sudo apt-get update && sudo apt-get install -y graphviz  # dot renders the flag-deps forest
          bash tools/ci_tooling/assets/render_diagrams.sh

      # Regenerate the per-feature footprint budget table in the README from the isolated
      # measurements in docs/feature_ranges.json (produced periodically by the RPi build matrix,
      # tools/ci_tooling/generate/feature_budget.py collect) - a no-op if that file is absent.
      - name: Regenerate footprint budget table
        run: |
          if [ -f docs/feature_ranges.json ]; then
            python -m tools.ci_tooling.generate.feature_budget readme docs/feature_ranges.json docs/footprints.json README.md
          fi

      # Regenerate the theme library + gallery, the toggleable theme blobs (Layer 7), and the favicon
      # library + gallery from their generators, so the committed CSS / C blobs / SVGs never drift from
      # the palette + motif sources. (Theme PNG previews are rendered separately by
      # tools/ci_tooling/assets/render_theme_previews.cjs; the favicon tarballs by tools/ci_tooling/assets/pack_favicons.sh.)
      - name: Regenerate theme + favicon libraries
        run: |
          python -m web_assets.wizard.gen_themes
          python -m web_assets.wizard.gen_themes gallery
          python -m web_assets.wizard.gen_theme_blobs
          python -m web_assets.wizard.gen_favicons
          python -m web_assets.wizard.gen_favicons gallery

      # Regenerate each example's Arduino build_opt.h from its README build_flags so the
      # examples keep building unmodified in the Arduino IDE.
      - name: Regenerate example build_opt.h files
        run: python -m tools.ci_tooling.generate.gen_build_opt

      # Regenerate the example index in docs/EXAMPLES.md from the examples/ tree so the
      # per-group lists + total count never drift (the Foundation group had silently lost
      # 16 entries before this was generated).
      - name: Regenerate example index from examples/
        run: python -m tools.ci_tooling.generate.gen_examples

      # The sidebar's sections and their order come from docs/nav/*.md, whose @subpage lists
      # are what stop Doxygen parking all 197 pages at the nav root. Generated so a section
      # cannot quietly lose a page, and so the order stays the intended reading order rather
      # than whatever order Doxygen happened to read the files in.
      - name: Regenerate documentation nav groups
        run: python -m tools.ci_tooling.generate.gen_nav_groups

      # Refresh test/README.md's generated sections (the env matrix scraped from test_matrix.json and
      # the per-test directory scraped from the test_*.cpp files) so they never drift from the suite.
      - name: Regenerate test/README.md from the suite
        run: python test/gen_test_readme.py

      - name: Format with Prettier
        run: npx prettier@3.9.6 --write README.md docs/README.md docs/EXAMPLES.md docs/THEMES.md docs/FAVICONS.md

      - name: Commit regenerated tables
        uses: ./.github/actions/bot-commit
        with:
          files: >-
            README.md docs/README.md docs/ARCHITECTURE.md docs/configurator.html docs/EXAMPLES.md
            docs/THEMES.md docs/FAVICONS.md test/README.md docs/diagrams
            web_assets/themes/generated web_assets/favicons
            src/network_drivers/application/binary_asset_blobs.c
            src/network_drivers/application/binary_asset_blobs.h
            examples/*/*/build_opt.h
          message: "docs: regenerate feature tables + configurator + build_opt.h + example index [skip ci]"
          signing-key: ${{ secrets.CI_SIGNING_KEY }}
