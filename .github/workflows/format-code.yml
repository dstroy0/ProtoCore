name: Format Code

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  format-code:
    name: Format Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Clang-Format 22
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-format-22
          sudo ln -sf /usr/bin/clang-format-22 /usr/bin/clang-format

      - name: Run Clang-Format Lint
        run: |
          # 1. Register a GitHub Problem Matcher for native LLVM diagnostic strings
          echo '{
            "problemMatcher": [
              {
                "owner": "clang-format-native",
                "pattern": [
                  {
                    "regexp": "^([^:]+):(\\d+):(\\d+):\\s+(warning|error):\\s+(.+)$",
                    "file": 1,
                    "line": 2,
                    "column": 3,
                    "severity": 4,
                    "message": 5
                  }
                ]
              }
            ]
          }' > .github/cf-matcher.json
          echo "::add-matcher::.github/cf-matcher.json"

          # 2. Gather all matching source files
          # Bypasses hidden directories like .git automatically.
          # build_opt.h is excluded: despite the .h suffix it is an Arduino build-options file
          # (a list of -D compiler flags, not C++), and its name is fixed by the Arduino toolchain.
          # .c is in the list because src/ is C11: the conversion renamed 351 implementation files
          # out from under a glob that only named .cpp, leaving them unchecked.
          # managed_components/ is what the IDF component manager downloads into an example. It is
          # vendored third-party source, not ours to style, and it is gitignored - so a checkout
          # restores it unformatted no matter what a local run did. 2026 files, all excluded.
          FILES=$(find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.ino" \) -not -path "*/.*" -not -path "*/managed_components/*" -not -name "build_opt.h")

          # 3. Handle empty repository safety edge-case
          if [ -z "$FILES" ]; then
            echo "No source files found matching (.cpp, .h, .ino). Skipping check."
            exit 0
          fi

          # 4. Run dry-run compilation style audit end-to-end
          # --style=file natively climbs to the root directory to find your .clang-format rules
          # --dry-run handles the formatting calculations safely
          # --Werror forces an exit code 1 if style rules are breached
          echo "$FILES" | xargs clang-format --style=file --dry-run --Werror

      - name: Python formatting (Black)
        # The C sources have been style-gated since the start; the ~120 Python files that generate,
        # check and measure them were not, so half of them had drifted. Sonar reads this tree too.
        # Line length comes from [tool.black] in pyproject.toml, so local and CI agree.
        run: |
          python3 -m pip install --quiet black
          git ls-files '*.py' | xargs python3 -m black --check --diff

      - name: Owner-context guard (no loose file-scope mutables)
        # Enforces the least-privilege owner pattern: every subsystem's mutable state must live in
        # one owned <Name>Ctx, not scattered ambient globals. Uniformity is how the outliers are
        # caught. See ci_tooling/check/check_owned_context.py for the allow-list rationale (shared substrate).
        run: python3 -m ci_tooling.check.check_owned_context

      - name: Test-coverage guard (every src/ TU has a test env)
        # A module ships with its native_<name> Unity env or it does not ship. Ratcheted: fails on a
        # src/ translation unit that no env's build_src_filter names, while the recorded gaps are
        # worked down. board_drivers/ is exempt - it only runs on silicon.
        run: python3 -m ci_tooling.check.check_test_coverage

      - name: Banned-constructs guard (src/ hard bans)
        # Server-side twin of the pre-commit hook: fails if any src/ source uses a construct banned
        # by docs/SRCBANNED.md (strlen, <stdlib.h> / heap / parse functions, auto, delay(), a
        # non-reentrant gmtime family call, or an em-dash). Comments / string literals are exempt.
        run: python3 -m ci_tooling.check.check_src_banned --all

      - name: No symbol is defined by two src/ files
        # The native envs compile an explicit source list, so a duplicated .cpp is invisible to
        # them. Arduino compiles every .cpp under src/, so a stray copy breaks all 152 sketches at
        # link time with the host suite still green - which is how a byte-identical second copy of
        # web_assets.cpp shipped.
        run: python3 -m ci_tooling.check.check_duplicate_symbols

      - name: Crypto KAT vectors up to date (generated .inc matches vendored JSON)
        # test/unit/crypto/test_crypto_kat/kat_data.inc is generated from the vendored external vectors in
        # test/vectors/*.json. Regenerate and fail if the committed table drifted from its source.
        run: |
          python3 tools/gen_crypto_vectors.py
          git diff --exit-code test/unit/crypto/test_crypto_kat/kat_data.inc
