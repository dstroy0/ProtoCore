name: Markdown Formatting Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  prettier:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Every type Prettier owns, not just markdown: the JSON, the workflow YAML, the docs CSS and
      # the hand-edited web-asset HTML drift the same way and nothing was checking them.
      # .prettierignore states what is out of scope and why. `tools/harness.py ci fmt` runs the
      # same glob locally, and the pre-commit hook formats these types on the way in.
      - name: Run Prettier check
        run: npx prettier@3.9.6 --check "**/*.{md,json,yml,yaml,css,html,js,cjs,mjs}"

      # On a pull request, flag stale tables so the author regenerates them. On a
      # push to main the Feature Tables workflow regenerates and commits them
      # automatically, so this check would only ever red the build there.
      - name: Feature/codec tables in sync with FEATURES.md
        if: github.event_name == 'pull_request'
        run: python3 -m tools.ci_tooling.generate.gen_feature_tables --check

      # Doc staleness guard. Documentation rots faster than code when the tree moves
      # quickly, and it rots SILENTLY - nothing fails, the doc just starts lying. This
      # fails when the prose cites a symbol, path, link, or test env the tree no longer
      # has. See the module docstring for what is deliberately NOT checked (Doxygen
      # @ref, C++ lambdas, URLs) and why.
      - name: Docs cite things that exist
        run: python3 -m tools.ci_tooling.check.check_docs

      # Example code drift guard, covering BOTH sketches and README fenced blocks.
      # The annotated-source blocks are hand-rolled on purpose (the annotation is the
      # teaching content), so they cannot be generated - which is exactly why they
      # drifted: 446 vendor calls and 144 bare enum members accumulated in them while
      # every sketch stayed clean. SRCBANNED rule 6 already claimed to cover
      # examples/; check_src_banned.py only ever read src/.
      - name: Example code uses the library API
        run: python3 -m tools.ci_tooling.check.check_examples

      # docs/SYMBOLS.md is the naming law; this enforces its mechanical half. The
      # prefix sweep is still open (roadmap "Now"), so it gates against a recorded
      # baseline: NEW violations fail, the 1313 known ones ratchet down. Unprefixed
      # macros are the bulk of them, and names like MAX_CONNS / BODY_BUF_SIZE are
      # exactly what collides with a professional's existing codebase.
      - name: Naming law (docs/SYMBOLS.md)
        run: python3 -m tools.ci_tooling.check.check_symbols --check

      # Every generated region a PR can make stale, asserted through the one CI entry point. Each
      # generator implements --check; several implemented it and nothing ran it, so the regions
      # could drift silently - a gate that exists and is not wired is the same as no gate. ci.py
      # prints ok/FAIL per generator, so a drifted region still names itself.
      #
      #   interop_matrix   peer / bench counts derived from the tree, not hand-maintained
      #   hardware_ref     the per-module hardware table, derived from the headers
      #   readme_intro     the quick start copied from Basic.ino + the status table from
      #                    test/coverage.xml and test/TEST_REPORT.md
      #   api_flow         docs/ARCHITECTURE.md + the README diagrams
      #   examples         docs/EXAMPLES.md
      #   flag_deps        the README flag-dependency block
      #   readme_sections  the docs/README.md reference sections
      #   changelog        the changelog decoration
      #   tools_inventory  tools/TOOLS.md's per-directory tables, scanned out of tools/ itself:
      #                    a PR that adds a script, or changes one's flags, makes them stale
      #   configurator     not markdown, but the same staleness class, and this is the only
      #   build_opt        workflow that runs on a pull request: Feature Tables regenerates both
      #                    on push to main, so without them a PR could not tell you it had made
      #                    them stale.
      - name: Generated regions in sync (ci.py gen --check)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m tools.ci_tooling.ci gen --check \
            interop_matrix hardware_ref readme_intro api_flow examples \
            flag_deps readme_sections changelog configurator build_opt tools_inventory
