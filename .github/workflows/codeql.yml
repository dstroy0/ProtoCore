name: CodeQL

# Static analysis of the C sources with CodeQL. c-cpp is the one extractor CodeQL has for
# both languages (the CLI still spells it `cpp`); what it records is whatever the traced
# compiler did, so a tree of .c files is extracted as C.
#
# Uses the "advanced" setup
# (not GitHub default setup) because the database must be built by tracing a real
# compile - here a host/native PlatformIO build of the security-critical cores
# (HTTP parser, WebSocket, multipart, base64/JSON, SSH crypto, SNMP, the codecs).
#
# The analyze step publishes a code-scanning check named "CodeQL" - require that
# context in the branch-protection rule / ruleset for main. (If GitHub "default"
# code scanning is enabled for C/C++, disable it under
# Settings -> Code security -> Code scanning so this advanced workflow can run.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1" # weekly, Mondays 06:27 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF / publish the CodeQL check
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: c-cpp
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # Host/native build of every native env; CodeQL traces the compiler, so a translation unit is
      # only analyzed if something here compiled it. A hand-listed subset silently left most of src/
      # unscanned, and the list could not track a new env. The set is read from the generated ini, so
      # adding an env to test/test_matrix.json extends the scan with it.
      #
      # --without-testing skips running the unit tests; test-report.yml is what runs and gates those.
      # A per-env failure does not abort the sweep: extraction happens per compiler invocation, so the
      # units that did compile are still in the database, and stopping here would discard the whole
      # scan over one bad env - which is how this workflow produced nothing at all. Failures are
      # reported to the run summary instead, and the test suite remains the build gate.
      - name: Build (native, traced by CodeQL)
        run: |
          mapfile -t ENVS < <(grep -oE '^\[env:native[A-Za-z0-9_]*\]' platformio.ini | sed -E 's/\[env:(.*)\]/\1/')
          echo "tracing ${#ENVS[@]} native env(s)"
          FAILED=()
          for e in "${ENVS[@]}"; do
            echo "::group::build $e"
            pio test --without-testing -e "$e" || FAILED+=("$e")
            echo "::endgroup::"
          done
          {
            echo "### CodeQL extraction"
            echo "Traced ${#ENVS[@]} env(s), ${#FAILED[@]} failed to build."
            if [ "${#FAILED[@]}" -ne 0 ]; then
              echo ""
              echo "Not extracted (or only partially):"
              for e in "${FAILED[@]}"; do echo "- \`$e\`"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          for e in "${FAILED[@]}"; do echo "::warning title=CodeQL build::$e failed to build; its units may be missing from the database"; done
          exit 0

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: "/language:c-cpp"
