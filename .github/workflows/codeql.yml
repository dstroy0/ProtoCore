name: CodeQL

# Static analysis of the C sources with CodeQL. c-cpp is the one extractor CodeQL has for
# both languages (the CLI still spells it `cpp`); what it records is whatever the traced
# compiler did, so a tree of .c files is extracted as C.
#
# Uses the "advanced" setup
# (not GitHub default setup) because the database must be built by tracing a real
# compile - here the host/native CMake build of the security-critical cores
# (HTTP parser, WebSocket, multipart, base64/JSON, SSH crypto, SNMP, the codecs).
#
# The analyze step publishes a code-scanning check named "CodeQL" - require that
# context in the branch-protection rule / ruleset for main. (If GitHub "default"
# code scanning is enabled for C/C++, disable it under
# Settings -> Code security -> Code scanning so this advanced workflow can run.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1" # weekly, Mondays 06:27 UTC

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF / publish the CodeQL check
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Unity's runner generator is Ruby; the runner image carries Ruby, ninja is added.
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: c-cpp
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # Host/native build of every native env; CodeQL traces the compiler, so a translation unit is
      # only analyzed if something here compiled it. test/CMakeLists.txt is generated from
      # test/test_matrix.json, so adding an env to the matrix extends the scan with it. Configuring
      # fetches Unity and littlefs (cmake/ProtoCoreDeps.cmake) and writes each suite's runner.
      #
      # Build only: test-report.yml is what runs and gates the suites. The build itself has to
      # succeed - a unit that does not compile is not in the database, and a scan that silently
      # covers part of src/ reads the same as one that covers all of it.
      - name: Build (native, traced by CodeQL)
        run: |
          python3 tools/harness.py build cmake
          cmake -S test -B build/native -G Ninja
          cmake --build build/native

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:c-cpp"
