name: "ProtoCore CodeQL config"

# Analyze only our own source. CMake fetches the third-party packages (Unity, littlefs) into
# build/native/_deps; those are not our code, so their findings are noise (they recurred as
# cpp/irregular-enum-init alerts). The generated Unity runners are Unity's output, not ours either.
# .pio is kept for a local pio build of the ESP32 env.
paths-ignore:
  - "build/**"
  - ".pio/**"
  - "**/.pio/**"
  - "**/unity_runner.c"
