    +<crypto/mac/hmac_sha256.c>
    +<crypto/mac/hmac_sha512.c>
    +<crypto/cipher/chacha20.c>
    +<crypto/mac/poly1305.c>
    +<crypto/aead/chachapoly.c>
    +<crypto/cipher/aes256ctr.c>
    +<crypto/aead/aesgcm.c>
    +<board_drivers/hal/portable/portable_aesgcm.cpp>
    +<crypto/asymmetric/ecdsa.c>
    +<crypto/asymmetric/bignum.c>
    +<board_drivers/hal/portable/portable_bignum.cpp>
    +<network_drivers/presentation/ssh/transport/ssh_keymat.c>
    +<network_drivers/presentation/ssh/transport/ssh_dh.cpp>
    +<crypto/asymmetric/rsa.c>
    +<network_drivers/tls/ssh_rsa.cpp>
    +<network_drivers/presentation/ssh/transport/ssh_packet.cpp>
    +<network_drivers/presentation/ssh/transport/ssh_comp.c>
    +<network_drivers/presentation/ssh/transport/ssh_zlib.c>
    +<network_drivers/presentation/ssh/transport/ssh_inflate.c>
    +<crypto/hash/sha512.c>
    +<crypto/asymmetric/curve25519.c>
    +<crypto/asymmetric/ed25519.c>
    +<network_drivers/presentation/ssh/transport/ssh_transport.cpp>
    +<network_drivers/presentation/ssh/auth/ssh_auth.cpp>
    +<network_drivers/presentation/ssh/connection/ssh_channel.cpp>
    +<network_drivers/presentation/ssh/connection/ssh_flow_control.cpp>
    +<network_drivers/presentation/ssh/connection/ssh_server.cpp>
    +<network_drivers/presentation/codec/inflate/inflate.c>
    +<mmgr/plaintext.c>
    +<mmgr/arena.c>
    +<network_drivers/session/worker.c>
    +<mmgr/secure.c>
    +<board_drivers/hal/portable/portable_platform.c>
    +<server/clock/clock.c>
test_filter =
    test_ssh_comp

