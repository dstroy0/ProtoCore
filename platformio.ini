; A double read as the three fields it is (mmgr/float_bits.h): sign at bit 63,
; exponent at 62..52, mantissa at 51..0, by mask and shift, and merged back from those three. The
; oracle is the layout written out in the test, not a second accessor. Covers that the three masks
; partition all 64 bits exactly once, the known encodings (1.0 is the bias with a zero mantissa,
; 3.14159 is exponent 1024, negative zero differs from zero in the sign alone), the non-finite and
; subnormal exponent fields, and the round trip: split into fields and merged back is the value that
; went in, at every one of the 64 bit positions, so no field is a bit short or a bit wide. The merge
; masks each field to its own width, so a field carrying junk above it cannot reach a neighbour.
[env:native_float_bits]
extends = native_base
build_src_filter =
    -<*>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<mmgr/float_bits.c>
test_filter =
    unit/src/mmgr/test_float_bits
extra_scripts =
    pre:test/gen_test_runners.py

; binary64 field reads (mmgr/float_bits.h) against IEEE 754 sec 3.4: the 1/11/52 interchange layout and bias 1023, with every expected word derived from that definition in the comment beside it (1.0 is 2^0, so its exponent field is 0 + 1023 -> 0x3FF0000000000000). Covers the two zeros, infinity and NaN sharing the all-ones exponent, the subnormal boundary, the largest finite value, per-field masking in the merge, and exhaustive round trips over all 64 bit positions and the whole exponent range.
[env:native_mmgr_float_bits]
extends = native_base
build_src_filter =
    +<mmgr/float_bits.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<mmgr/protomem.c>
test_filter =
    unit/src/mmgr/test_float_bits
extra_scripts =
    pre:test/gen_test_runners.py

