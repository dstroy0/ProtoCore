[platformio]
default_envs = esp32dev

[env:esp32dev]
; Unpinned, tracking the default branch, so development happens on the current
; toolchain rather than a frozen one.
;
; The registry's espressif32 cannot deliver that: 7.0.1 still hard-pins
; framework-arduinoespressif32 ~3.20017.0, which is Arduino core 2.0.17, IDF 4.4.7
; and gcc 8.4. Its sdk covers four dies (esp32, s2, s3, c3) and none of c5, c6,
; c61, h2 or p4. pioarduino carries Arduino core 3.x, IDF 5.x, gcc 14.2 and every
; die, so the radio and peripheral work can build against the framework this
; project actually ships on.
;
; mbedtls goes v2 to v3 with core 3.x; ssh_rsa.c guards on MBEDTLS_VERSION_MAJOR
; and builds either way. See docs/TODO.md "Build / toolchain".
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32dev
framework = arduino
monitor_speed = 115200

; src/ is C11 (docs/SRC_LAW.md section 0): _Atomic and static_assert do not exist below it. The
; framework builder appends -std=gnu99 to CFLAGS after everything in build_flags, and gcc takes the
; last -std it is given, so naming gnu11 alone is overridden and the flag has to be removed first.
; C++ is untouched: -std=gnu++11 lands in CXXFLAGS, and only the C flag is replaced here.
; library.json states the same pair, for a consumer that builds this as a dependency.
build_unflags = -std=gnu99
build_flags = -std=gnu11

; >>> GENERATED TEST ENVS - do not edit below; edit test/test_matrix.json and run test/harness.py env gen >>>
; Single source of truth: test/test_matrix.json  (406 native envs, 13 stack bases)

; Shared flags for all native environments
[native_base]
platform = native
build_flags =
    ; src/ is C11 (docs/SRC_LAW.md section 0).
    -std=c11
    ; strnlen is POSIX 2008, not ISO C11, and -std=c11 asks glibc for ISO C alone - so <string.h>
    ; declares strlen and not strnlen. Ban #1 (docs/SRCBANNED.md) requires strnlen everywhere, so
    ; without this the whole tree compiles it as an implicit declaration returning int, and every
    ; `size_t n = strnlen(...)` truncates through 32 bits with nothing but a warning. Naming the
    ; POSIX level is what makes the bounded string functions visible; the language stays C11.
    -D_POSIX_C_SOURCE=200809L
    ; src/ contains no throw / try / catch (no-heap, no-stdlib, deterministic - and the ESP32
    ; target builds without exceptions anyway), so this only strips what the host toolchain would
    ; add on its own. It matters for coverage: with exceptions on, g++ emits an unwind edge at
    ; every call to a function that is not noexcept, and gcov counts each one as a BRANCH. Those
    ; edges are unreachable by construction in a codebase that never throws, so they are pure
    ; noise in the branch numbers and they make 100% branch coverage unattainable - wamp.cpp alone
    ; carried 114 of them (280 branches -> 166, and 57 of its 84 "uncovered" branches vanished).
    ; Keep this here rather than only in the coverage run so the tested build and the measured
    ; build are the same build.
    -fno-exceptions
    ; Link-time optimization, required rather than preferred. The transport's slot state lives
    ; behind an incomplete type, so its accessors are defined in one translation unit and called
    ; from others. Measured on gcc 13.2, gcc 16.1 and clang 22 (tools/dev_env/pimpl_bench): without
    ; -flto those calls are NEVER inlined at any level - -O0 through -Os and -Oz all emit the call.
    ; With -flto they inline from -O1 (gcc) / -O2 (clang), and the hot loop comes out the same size
    ; or smaller than the fully-public struct it replaced.
    -flto
    ; The host branch of the platform: the stand-ins protocore_platform.h reaches for by bare name
    ; (protocore_net_host.h, Arduino.h, freertos/, lwip/) when no vendor macro matched. It sits on
    ; the include path as a root of its own, so those names resolve the way a vendor SDK's do.
    ; The host has no bounded DRAM, so the arenas are sized far past any suite's worst case. A
    ; span that fails to allocate is then a real defect rather than a budget the env forgot to
    ; raise: the route table, the persist end and the scratch end all come out of this one pool.
    -DPROTOCORE_SECURE_ARENA_SIZE=262144
    -I core_setup/hal/host
    -I test/support
    -I src
    ; core_setup/ sits beside src/, not inside it, so the board profile an include names as
    ; core_setup/board_profiles/... resolves from the repo root rather than from src/.
    -I .
    ; PROTOCORE_HOST is NOT defined here. board_profiles/protocore_platform.h derives it from the vendor
    ; axis: nothing on a native build matches a vendor, so its else-arm defines it. Passing it on
    ; the command line as well made a second source of truth that the vendor axis could not
    ; libm is a separate library to the C driver. g++ pulled it in behind libstdc++, so nothing here
    ; ever named it; gcc does not, and every env whose sources call sin / cos / sqrt / atan2 / fabs
    ; fails at the link with an undefined reference instead. It sits in the shared block because
    ; which envs reach a math call is a property of their sources, not of their configuration.
    -lm
; The filesystem the device actually runs, so a host test asserts against real directory
; semantics rather than a hand-rolled tree that agrees with itself. Only the envs whose sources
; include lfs.h build it - the dependency finder does not compile what nothing reaches for.
lib_deps =
    anurag3301/littlefs@^2.11.6
; Link library objects directly instead of collecting them into a .a first. Unity is meant to be
; compiled from source with the project's own flags (UnityConfigurationGuide.md), and an archive
; built without LTO IR cannot satisfy an LTO link: the plugin drops UnityAssertEqualNumber and
; UnityFail and every suite fails to link.
lib_archive = no
test_build_src = yes

; Accept-time connection gates with their flags ON (PROTOCORE_ENABLE_ACCEPT_THROTTLE
; / PER_IP_THROTTLE / IP_ALLOWLIST): the global fixed-window throttle, the per-source-IP
; bucket table (independent budgets, window rollover, the millis() wrap, bounded LRU
; eviction), and the CIDR source-IP allowlist. Compiles the flag-guarded accept-callback
; paths that no other env builds. Budgets overridden small so the boundaries are explicit.
[env:native_accept_gate]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_ENFORCE_HOST_HEADER=0
    -DPROTOCORE_ENABLE_ACCEPT_THROTTLE=1
    -DPROTOCORE_ENABLE_PER_IP_THROTTLE=1
    -DPROTOCORE_ENABLE_IP_ALLOWLIST=1
    -DPROTOCORE_ACCEPT_THROTTLE_MAX=3
    -DPROTOCORE_ACCEPT_THROTTLE_WINDOW_MS=1000
    -DPROTOCORE_PER_IP_THROTTLE_MAX=2
    -DPROTOCORE_PER_IP_THROTTLE_WINDOW_MS=1000
    -DPROTOCORE_PER_IP_THROTTLE_SLOTS=4
    -DPROTOCORE_IP_ALLOWLIST_SLOTS=4
    -DPROTOCORE_HAS_NET_STACK=1
build_src_filter =
    +<shared/ip/ip.c>
    +<network_drivers/presentation/http/http_parser/http_parser.c>
    +<network_drivers/transport/tcp/server/server.c>
    +<network_drivers/transport/tcp/tcp.c>
    +<network_drivers/transport/tcp/client/client.c>
    +<network_drivers/transport/tcp/protocol/protocol.c>
    +<network_drivers/transport/tcp/lower/lower.c>
    +<network_drivers/transport/net_addr/net_addr.c>
    +<network_drivers/presentation/presentation.c>
    +<mmgr/protostr.c>
    +<network_drivers/session/session.c>
    +<server/protocore_builtins.c>
    +<mmgr/plaintext.c>
    +<mmgr/arena.c>
    +<server/core/worker.c>
    +<crypto/hash/sha1.c>
    +<network_drivers/presentation/codec/base64/base64.c>
    +<network_drivers/presentation/http/websocket/websocket.c>
    +<network_drivers/session/ws/ws.c>
    +<network_drivers/presentation/http/sse/sse.c>
    +<network_drivers/session/sse/sse.c>
    +<network_drivers/presentation/codec/multipart/multipart.c>
    +<../core_setup/hal/portable/portable_platform.c>
    +<server/clock/clock.c>
    +<mmgr/protomem.c>
    +<mmgr/bytes.c>
    +<mmgr/endian.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/secure.c>
    +<mmgr/span.c>
    +<mmgr/swar.c>
    +<shared/hex/hex.c>
    +<shared/utf8/utf8.c>
test_filter =
    unit/integration/transport/test_accept_gate

; AD9238 SPI configuration-port codec (server/peripherals/ad9238): the 16-bit instruction word
; (R/W + byte-count + 13-bit address) for single-byte register writes/reads, the device-update
; transfer transaction, and the input-validation fail-closed paths (null buffer, undersized
; cap, zero/oversize byte count, out-of-range address). Pure host tests - the SPI clocking and
; the per-register bit-field meanings are the datasheet's / the application's, not this codec's.
[env:native_ad9238]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_ENABLE_AD9238=1
build_src_filter =
    +<server/peripherals/ad9238/ad9238.c>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
test_filter =
    unit/file_conversion/server/peripherals/ad9238/test_ad9238
extra_scripts =
    pre:test/gen_test_runners.py

; Beckhoff ADS / AMS codec (services/fieldbus/ads): the AMS/TCP + AMS-header request builders
; (little-endian, target-before-source addressing, cmd id + state flags + cbData + invoke id) for
; Read/Write/ReadWrite/ReadState/ReadDeviceInfo/WriteControl/Add+DeleteNotification + the response
; parsers incl. the DeviceNotification stamp/sample walk. TwinCAT PC-based control. Pure host tests.
[env:native_ads]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_ENABLE_ADS=1
build_src_filter =
    +<services/fieldbus/ads/ads.c>
    +<mmgr/protomem.c>
    +<mmgr/endian.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
test_filter =
    unit/src/services/fieldbus/ads/test_ads
extra_scripts =
    pre:test/gen_test_runners.py

; ADS1115 16-bit ADC codec and its I2C binding (server/peripherals/ads1115): building the 16-bit config word for a single-shot single-ended reading (channel MUX, gain, data rate, start/mode/comparator bits, with out-of-range fallbacks), converting a signed 16-bit sample to microvolts across the gain's full-scale range, and reading a part end to end - the suite puts a voltage on a pin of the SBAS444E device model in core_setup/hal/host/devices/ and the driver's own transfers bring back the code the part computes for it.
[env:native_ads1115]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_ENABLE_ADS1115=1
build_src_filter =
    +<server/peripherals/ads1115/ads1115.c>
    +<server/clock/clock.c>
    +<mmgr/protomem.c>
    +<mmgr/endian.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<mmgr/secure.c>
    +<mmgr/span.c>
    +<mmgr/arena.c>
    +<../core_setup/hal/portable/portable_platform.c>
test_filter =
    unit/src/server/peripherals/ads1115/test_ads1115
extra_scripts =
    pre:test/gen_test_runners.py

; AMQP 0-9-1 frame codec (services/iot/amqp): the protocol header, the frame + method
; builders, the heartbeat, and the frame/method parsers (type/channel/size/payload/0xCE).
; Pure host tests.
[env:native_amqp]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_ENABLE_AMQP=1
build_src_filter =
    +<services/iot/amqp/amqp.c>
    +<mmgr/protomem.c>
    +<mmgr/endian.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
test_filter =
    unit/src/services/iot/amqp/test_amqp
extra_scripts =
    pre:test/gen_test_runners.py

; test_application against the native_stack_http stack.
[env:native_application]
extends = native_stack_http
build_flags =
    ${native_stack_http.build_flags}
    -DPROTOCORE_ENABLE_FILE_SERVING=1
    -DPROTOCORE_ENABLE_WEBSOCKET=1
    -DPROTOCORE_ENABLE_SSE=1
test_filter =
    unit/integration/misc/test_application

; Unified double-ended server arena (server/core/protocore_arena): first-fit
; persistent end (bottom, individual free + coalesce + boundary shrink) + bump scratch end
; (top, mark/release/reset) sharing a floating middle; fail-closed at the boundary. Host tests.
[env:native_arena]
extends = native_base
build_src_filter =
    +<mmgr/arena.c>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<../core_setup/hal/portable/portable_platform.c>
test_filter =
    unit/src/mmgr/test_arena
extra_scripts =
    pre:test/gen_test_runners.py

