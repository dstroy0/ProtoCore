    +<crypto/asymmetric/ed25519.c>
    +<crypto/kdf/hkdf.c>
    +<mmgr/arena.c>
    +<mmgr/secure.c>
    +<mmgr/plaintext.c>
    +<server/core/worker.c>
    +<../core_setup/hal/portable/portable_platform.c>
    +<mmgr/protomem.c>
    +<mmgr/endian.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/span.c>
    +<mmgr/swar.c>
    +<mmgr/protostr.c>
    +<crypto/mac/ghash.c>
    +<crypto/aead/aes128gcm.c>
