build_src_filter =
    +<services/machine_tool/atc/atc.c>
    +<mmgr/protostr.c>
    +<mmgr/protomem.c>
    +<mmgr/membuild.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<mmgr/float_bits.c>
    +<shared/hex/hex.c>
test_filter =
    unit/src/services/machine_tool/atc/test_atc
extra_scripts =
    pre:test/gen_test_runners.py

; Tamper-evident hash-chained audit log (server/security/audit_log). Pure - the chain is
; identical on host and ESP32 - so it unit-tests on the host; SHA-256 comes from
; crypto/sha256 (software path on native), the timestamp from the pluggable clock.
[env:native_audit_log]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_ENABLE_AUDIT_LOG=1
build_src_filter =
    +<server/security/audit_log/audit_log.c>
    +<crypto/hash/sha256.c>
    +<server/clock/clock.c>
    +<mmgr/protostr.c>
    +<mmgr/protomem.c>
    +<mmgr/secure.c>
    +<mmgr/arena.c>
    +<mmgr/endian.c>
    +<mmgr/membuild.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/span.c>
    +<mmgr/swar.c>
    +<shared/hex/hex.c>
    +<mmgr/float_bits.c>
    +<../core_setup/hal/portable/portable_platform.c>
test_filter =
    unit/src/server/security/audit_log/test_audit_log
extra_scripts =
    pre:test/gen_test_runners.py

; test_auth against the native_stack_http stack.
[env:native_auth]
extends = native_stack_http
build_flags =
    ${native_stack_http.build_flags}
    -DPROTOCORE_ENABLE_AUTH=1
    -DPROTOCORE_ENABLE_WEBSOCKET=1
    -DPROTOCORE_ENABLE_SSE=1
test_filter =
    unit/integration/http/test_auth

; Per-IP brute-force auth lockout (server/security/auth_lockout): exponential-backoff
; lockout state machine. Pure core (the millisecond clock is passed in), so it
; unit-tests on the host. PROTOCORE_ENABLE_AUTH_LOCKOUT (and its required parent
; PROTOCORE_ENABLE_AUTH) are set so the flag-guarded code compiles.
[env:native_auth_lockout]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_ENABLE_AUTH=1
    -DPROTOCORE_ENABLE_AUTH_LOCKOUT=1
    -DPROTOCORE_ENABLE_WEBSOCKET=1
    -DPROTOCORE_ENABLE_SSE=1
build_src_filter =
    +<server/security/auth_lockout/auth_lockout.c>
    +<shared/ip/ip.c>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<shared/hex/hex.c>
test_filter =
    unit/src/server/security/auth_lockout/test_auth_lockout
extra_scripts =
    pre:test/gen_test_runners.py

; BACnet/IP BVLC + NPDU codec (services/fieldbus/bacnet): the BVLC envelope (type 0x81,
; function, length) + the NPDU header (version + NPCI control + optional DNET/DADR + hop
; count) builders and parsers, slicing the APDU. ASHRAE 135. Pure host tests.
[env:native_bacnet]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_ENABLE_BACNET=1
build_src_filter =
    +<services/fieldbus/bacnet/bacnet.c>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
test_filter =
    unit/src/services/fieldbus/bacnet/test_bacnet
extra_scripts =
    pre:test/gen_test_runners.py

; test_base64 against the native_stack_l46 stack.
[env:native_base64]
extends = native_stack_l46
test_filter =
    unit/src/network_drivers/presentation/codec/base64/test_base64
extra_scripts =
    pre:test/gen_test_runners.py

; The base64 codec (network_drivers/presentation/codec/base64) against RFC 4648: the seven sec 10 BASE64() vectors verbatim in both directions, the sec 4 Table 1 and sec 5 Table 2 spellings of alphabet values 62 and 63 (plus and slash against minus and underline), and the sec 3.3 requirement that encoded data holding characters outside the alphabet in use MUST be rejected, which each alphabet is checked against with the other's two characters as well as with a short quad, a pad before the tail and padding mid-stream. Also the destination-capacity guard on each of the three octets a quad writes, the unpadded final groups of sec 3.2 that base64url decodes, and a round-trip identity over every tail length in both alphabets, which checks the table-driven encoder against the branchless constant-time decoder rather than either against itself. This is the default SWAR decode path; native_codec_base64_scalar runs the same suite with PROTOCORE_BASE64_SWAR=0.
[env:native_codec_base64]
extends = native_base
build_src_filter =
    +<network_drivers/presentation/codec/base64/base64.c>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<mmgr/protostr.c>
test_filter =
    unit/src/network_drivers/presentation/codec/base64/test_base64
extra_scripts =
    pre:test/gen_test_runners.py

; The base64 scalar constant-time decode fallback (PROTOCORE_BASE64_SWAR=0): classify one character at a time instead of the default four-per-word SWAR path. Runs the same RFC 4648 suite as native_codec_base64, which proves the two decoders answer identically on the sec 10 vectors, on both sec 4 and sec 5 alphabets, on the sec 3.3 refusals, on the capacity guard and over the round-trip corpus.
[env:native_codec_base64_scalar]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_BASE64_SWAR=0
build_src_filter =
    +<network_drivers/presentation/codec/base64/base64.c>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<mmgr/protostr.c>
test_filter =
    unit/src/network_drivers/presentation/codec/base64/test_base64
extra_scripts =
    pre:test/gen_test_runners.py

; The LSB-first bit writer (mmgr/bitio.h) the DEFLATE encoder and the SSH
; zlib@openssh.com compressor both write their bitstreams through. Bits are read back by a bit
; reader written in the test, so the packing order is asserted against a decoder's walk rather than
; against the writer's own accumulator. Covers the whole-byte spill out of the accumulator, a
; single put wider than a byte, the zero padding an align puts in the high bits of a partial byte,
; an align on a boundary emitting nothing, and the capacity edge: an exact fill is not an overflow,
; a byte past cap latches it and leaves the byte past cap untouched, and an align with no room
; latches rather than writing.
[env:native_bitio]
extends = native_base
build_src_filter =
    -<*>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<mmgr/bitio.c>
test_filter =
    unit/src/mmgr/test_bitio
extra_scripts =
    pre:test/gen_test_runners.py

; LSB-first bit writer (mmgr/bitio.h) against RFC 1951: the sec 3.1.1 packing order, the sec 3.2.3 block header, the sec 3.2.6 fixed-Huffman end-of-block code (the empty final block is the octets 03 00), and the sec 3.2.4 stored-block LEN/NLEN pair. Plus the capacity edge: an exact fill is not an overflow, a spill past cap latches and stores nothing, an align with no room latches, and the flag never clears.
[env:native_mmgr_bitio]
extends = native_base
build_src_filter =
    +<mmgr/bitio.c>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
test_filter =
    unit/src/mmgr/test_bitio
extra_scripts =
    pre:test/gen_test_runners.py

