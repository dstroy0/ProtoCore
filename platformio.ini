    +<src/crypto/asymmetric/ed25519.c>
    +<src/crypto/asymmetric/curve25519.c>
    +<src/crypto/asymmetric/bignum.c>
    +<../core_setup/hal/portable/portable_bignum.c>
    +<src/crypto/hash/sha256.c>
    +<src/crypto/hash/sha512.c>
    +<src/mmgr/protomem.c>
    +<src/mmgr/rawmemcpy.c>
    +<src/mmgr/swar.c>
    +<src/mmgr/secure.c>
    +<src/mmgr/arena.c>
    +<src/mmgr/plaintext.c>
    +<src/mmgr/span.c>
    +<src/mmgr/bytes.c>
    +<src/mmgr/endian.c>
    +<../core_setup/hal/portable/portable_platform.c>
    +<src/crypto/mac/hmac_sha256.c>
test_filter =
    unit/src/crypto/x509/test_x509_verify

