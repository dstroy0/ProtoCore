    unit/integration/peripherals/test_bus_wire

; The byte verbs (mmgr/bytes.h): append into a protocore_span, take out of a protocore_cspan, and the
; offset-passing reads a parser walks a raw payload with. The append side keeps counting pos past
; cap on overflow, so an undersized region reports the capacity it should have had instead of only
; failing - asserted on both the single byte and the multi-byte width. The take side is checked at
; the boundary and one past it, with the sticky error and a refused read leaving both the cursor and
; the output untouched. The length-prefixed blob reads are the peer-controlled path: the prefix is a
; full u32 the peer picks, size_t is 32 bits on esp32 and c2000, and every bound here is a
; subtraction against the space that remains rather than a sum that would wrap - a 0xFFFFFFFF prefix
; is refused with the offset back where it started, and an exact fit is still accepted.
[env:native_bytes]
extends = native_base
build_src_filter =
    -<*>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<mmgr/bytes.c>
    +<mmgr/endian.c>
    +<mmgr/span.c>
test_filter =
    unit/src/mmgr/test_bytes
extra_scripts =
    pre:test/gen_test_runners.py

; Byte verbs (mmgr/bytes.h) against RFC 4251 sec 5: the worked uint32 (0x29b7f4aa -> 29 b7 f4 aa), the worked string ("testing" -> 00 00 00 07 ...), and the mpint table, whose leading-zero rule mpint_fixed undoes. Plus the region contracts: a write past cap stores nothing and the cursor reports the capacity needed, a refused read leaves the cursor and the destination alone, and a peer-chosen full-range u32 length is refused on the space that remains rather than admitted by a sum that wrapped.
[env:native_mmgr_bytes]
extends = native_base
build_src_filter =
    +<mmgr/bytes.c>
    +<mmgr/span.c>
    +<mmgr/endian.c>
    +<mmgr/protostr.c>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
test_filter =
    unit/src/mmgr/test_bytes
extra_scripts =
    pre:test/gen_test_runners.py

