; The fixed-width serializers (mmgr/endian.h): a width moved between an integer and
; the bytes at a pointer, both orders, 16/32/64. Each writer is diffed against a shift loop written
; in the test rather than against its opposite number, so a pair that is wrong the same way both
; ways cannot agree its way to a pass. Covers the returned width a caller advances by, the reader
; inverting the writer, a big-endian encoding being the byte reverse of the little-endian one, the
; round trip at every offset within a word (the file writes a byte at a time so a strict-alignment
; die is served), and a narrow write leaving the bytes above it alone so packed fields do not
; clobber each other.
[env:native_endian]
extends = native_base
build_src_filter =
    -<*>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<mmgr/endian.c>
test_filter =
    unit/src/mmgr/test_endian
extra_scripts =
    pre:test/gen_test_runners.py

; Fixed-width serializers (mmgr/endian.h) against RFC 1071 sec 3, whose numerical example prints one octet string and states each of its 16- and 32-bit fields in Normal (network) and Swapped order - the big- and little-endian readings published as numbers. RFC 4251 sec 5 supplies the writer side (699921578 stored as 29 b7 f4 aa) and the uint64 rule. Plus: writers return their width, touch only their width, round-trip at every offset in a word, and the two orders are byte reversals of each other.
[env:native_mmgr_endian]
extends = native_base
