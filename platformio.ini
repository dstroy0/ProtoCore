; Layer 1 driven through a REAL backend: the env declares PROTOCORE_PHYSICAL_HAS_BACKEND=1,
; so and core_setup/hal/host/physical stands in for silicon instead of the
; no-op stubs in physical.c. Nothing else in the tree builds that backend, and without it every L1
; readout answers empty - which means a caller that mishandles a live link reads exactly like one
; that works, and no assertion can tell them apart. Here the link actually comes up: the station
; associates and reports its SSID, channel and a negative dBm RSSI; the softAP takes its own address
; without stealing the route; Ethernet then takes the default route from the station, the way a
; stack picks one when both are up. That is also the only way to separate the same-signature members
; a stub build cannot - eth->init from eth->ready, ip6->init from ip6->ready, and link->mac from
; link->egress_mac, which return DIFFERENT addresses once a wired link carries traffic. Addresses
; are RFC 5737 TEST-NET-1 and RFC 3849 2001:db8::/32, the MACs are checked for the IEEE 802 U/L and
; I/G bits, the SSID cap is IEEE 802.11-2020 9.4.2.2's 32 octets, and a global IPv6 address is
; checked not to be an RFC 4291 sec 2.5.6 link-local. PROTOCORE_RADIO_WIFI_PS is set to max modem so the
; keep-awake refcount is provable: the first busy_hold forces sleep off and the balancing release
; restores the configured mode, which is indistinguishable from the held state at the default of 0.
; This is the only env that compiles radio_power.c's backend arm at all.
[env:native_phy]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_PHYSICAL_HAS_BACKEND=1
    -DPROTOCORE_ENABLE_ETHERNET=1
    -DPROTOCORE_ENABLE_IPV6=1
    -DPROTOCORE_ENABLE_RADIO_POWER=1
    -DPROTOCORE_RADIO_WIFI_PS=2
build_src_filter =
    -<*>
    +<network_drivers/physical/physical.c>
    +<network_drivers/physical/radio_power.c>
    +<../core_setup/hal/host/physical/physical_mock.c>
    +<shared/ip/ip.c>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<shared/hex/hex.c>
    +<mmgr/plaintext.c>
    +<mmgr/span.c>
    +<mmgr/arena.c>
    +<../core_setup/hal/portable/portable_platform.c>
test_filter =
    unit/src/network_drivers/physical/test_phy
extra_scripts =
    pre:test/gen_test_runners.py

; Layer 1 driven through a real backend: the env declares PROTOCORE_PHYSICAL_HAS_BACKEND=1, so core_setup/hal/host/physical stands in for silicon instead of the no-op stubs in physical.c, and the link can actually come up. That is what makes the readouts checkable at all, since a stub answers every one of them with an empty value and a caller that mishandles a live link then reads exactly like one that works. The station associates and reports its SSID, its channel and a negative dBm RSSI; the softAP takes its own address without stealing the route; Ethernet then takes the default route from the station the way a stack picks one when both are up. It is also the only way to separate the same-signature calls a stub build cannot: eth_init from eth_ready, ip6_init from ip6_ready, and wifi_mac from egress_mac, which answer with DIFFERENT addresses once a wired link carries traffic. Addresses are RFC 5737 TEST-NET-1 and RFC 3849 2001:db8::/32, the hardware addresses are checked for the RFC 7042 sec 2.1 U/L and I/G bits, the SSID cap is IEEE 802.11-2020 9.4.2.2's 32 octets, and a global unicast IPv6 address (RFC 4291 sec 2.5.4) is checked not to be an RFC 4291 sec 2.5.6 link-local. PROTOCORE_RADIO_WIFI_PS is set to max modem so the keep-awake refcount is provable: the first hold forces doze off and the balancing release restores the configured mode, which at the default of 0 would be indistinguishable from the held state. This is the only env that compiles radio_power.c's backend arm at all.
[env:native_l1_link]
extends = native_base
build_flags =
    ${native_base.build_flags}
    -DPROTOCORE_PHYSICAL_HAS_BACKEND=1
    -DPROTOCORE_ENABLE_ETHERNET=1
    -DPROTOCORE_ENABLE_IPV6=1
    -DPROTOCORE_ENABLE_RADIO_POWER=1
    -DPROTOCORE_RADIO_WIFI_PS=2
build_src_filter =
    +<network_drivers/physical/physical.c>
    +<network_drivers/physical/radio_power.c>
    +<../core_setup/hal/host/physical/physical_mock.c>
    +<shared/ip/ip.c>
    +<shared/hex/hex.c>
    +<mmgr/protomem.c>
    +<mmgr/rawmemcpy.c>
    +<mmgr/swar.c>
    +<mmgr/plaintext.c>
    +<mmgr/span.c>
    +<mmgr/arena.c>
    +<../core_setup/hal/portable/portable_platform.c>
test_filter =
    unit/src/network_drivers/physical/test_phy
extra_scripts =
    pre:test/gen_test_runners.py

