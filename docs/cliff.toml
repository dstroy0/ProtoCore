# git-cliff configuration for ProtoCore
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to ProtoCore are documented here.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/dstroy0/ProtoCore/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false  # include all commits, not just conventional ones
split_commits = false
# Each name and version in a generated subject goes into a code span, where ASD-STE100 reads it as a technical name.
commit_preprocessors = [
  { pattern = 'bump (\S+) from (\S+) to (\S+)',          replace = 'bump `${1}` from `${2}` to `${3}`' },
  { pattern = "Merge pull request (#\\d+) from (\\S+)",    replace = 'Merge pull request ${1} from `${2}`' },
  { pattern = "Merge branch '([^']+)' into (\\S+)",        replace = 'Merge branch `${1}` into `${2}`' },
]
commit_parsers = [
  { message = "^feat",                  group = "Features"       },
  { message = "^fix",                   group = "Bug Fixes"      },
  { message = "^doc|^docs",             group = "Documentation"  },
  { message = "^perf",                  group = "Performance"    },
  { message = "^refactor",              group = "Refactor"       },
  { message = "^test",                  group = "Testing"        },
  { message = "^ci|^build|^chore",      group = "CI / Build"     },
  { message = ".*",                     group = "Changes"        },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
topo_order = false
