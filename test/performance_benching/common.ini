; Shared PlatformIO settings for every on-device CCOUNT microbenchmark under performance_benching/.
; The benches are C11 on ESP-IDF: each feature's dir holds main/main.c and its main/CMakeLists.txt.
; Each feature's own platformio.ini pulls this in with `extra_configs = <rel>/common.ini`,
; `extends = common_s3`, and adds its own `lib_deps` symlink + `-I<rel>/common` (relative depth
; varies by layer) plus its `-DPROTOCORE_ENABLE_*` flags. Board: esp32-s3-devkitc-1.
[common_s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
build_flags =
