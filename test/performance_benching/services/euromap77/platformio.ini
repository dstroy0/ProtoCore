; On-device CCOUNT microbenchmark. See performance_benching/README.md.
[platformio]
src_dir = main
extra_configs = ../../common.ini

[env:esp32s3]
extends = common_s3
lib_deps = symlink://../../../
build_flags =
    ${common_s3.build_flags}
    -I../../common
    -DPROTOCORE_ENABLE_OPCUA=1
    -DPROTOCORE_ENABLE_EUROMAP77=1
