; On-device CCOUNT microbenchmark. See performance_benching/README.md.
[platformio]
extra_configs = ../../common.ini

[env:esp32s3]
extends = common_s3
lib_deps = symlink://../../../
build_flags =
    ${common_s3.build_flags}
    -I../../common
    -DPC_ENABLE_FORWARD=1
    -DPC_FWD_MAX_IFACES=4
    -DPC_FWD_MAX_RULES=4
    -DPC_FWD_MAX_ACL=4
    -DPC_FWD_MAX_ROUTES=4
    -DPC_FWD_INSPECT=1
