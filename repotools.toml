#
# The settings of the tools under tools/repotools. The tools walk up to this file, so its place at the root
# marks the root of the repository.
#
# Each setting has a default in tools/repotools/lib/repotools/defaults.toml. This file states the
# settings where ProtoCore differs from those defaults.
#
#   repotools config     what this file resolves to, after the defaults merge under it

[project]
name = "ProtoCore"
version = "1.0.16"
spdx = "AGPL-3.0-or-later"
copyright = "Copyright (C) 2026 Douglas Quigg (dstroy0) <dquigg123@gmail.com>"
prefix = "PROTOCORE"

[layout]
source = ["src", "include"]
docs = ["docs"]
examples = ["examples"]
tests = ["test"]
tools = "tools"
scratch = "build"

[code]
# These choose a parser, and not a scope. src/ is C11, and no tool here parses the .cpp and .ino
# sketches under examples/.
extensions = [".c", ".h"]
skip_files = ["unity_runner.c"]
# The directories that no tool walks. managed_components holds what the IDF component manager
# downloads into an example, and .pio_cov_wsl is the instrumented build directory of the WSL clone.
exclude = [
    ".git",
    "__pycache__",
    "build",
    "build-cov",
    "build-bench",
    "build-werror",
    "site",
    "vendor",
    "_vendor",
    "deps",
    ".pio",
    ".pio_cov",
    ".pio_cov_wsl",
    "managed_components",
    "node_modules",
    "coverage_reports",
]

[prose]
roots = ["README.md", "docs"]
