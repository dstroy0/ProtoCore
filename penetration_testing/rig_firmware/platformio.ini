; ESP32-S3 test-rig firmware for penetration_testing/pc_pentest.py + JTAG perf profiling.
; Reproducible build. WiFi credentials are NEVER committed - they come from your environment:
;
;   RIG_WIFI_SSID='your-ssid' RIG_WIFI_PASS='your-pass' \
;     pio run -e rig_s3 -t upload --upload-port /dev/ttyACM0
;
; See README.md for the full build / flash / JTAG-profile recipe and pinned toolchain versions.

[env:rig_s3]
platform = espressif32@6.13.0     ; pinned for reproducibility (Arduino-ESP32 2.x core)
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
board_build.filesystem = littlefs ; WebDAV share backing store on the internal-flash data partition

; -Og -ggdb3: keep symbols + sane inlining so openocd/xtensa-esp32s3-elf-gdb can PC-sample the
; real firmware (no instrumentation) and read CCOUNT for cycle-accurate device us/op.
build_type = debug
build_flags =
    -Og
    -ggdb3
    -DCORE_DEBUG_LEVEL=0
    ; Route Serial to the native USB-CDC (the /dev/ttyACMx the logger reads); without this the
    ; S3's Serial goes to physical UART0 and RIG_IP never reaches the serial log.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWIFI_SSID=\"${sysenv.RIG_WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.RIG_WIFI_PASS}\"
    -DPC_ENABLE_DIAG=1
    -DPC_ENABLE_STATS=1
    -DPC_ENABLE_METRICS=1
    -DPC_ENABLE_AUTH=1
    -DPC_ENABLE_AUTH_LOCKOUT=1
    -DPC_ENABLE_FILE_SERVING=1
    -DPC_ENABLE_RANGE=1
    -DPC_ENABLE_ETAG=1
    -DPC_ENABLE_ACCEPT_THROTTLE=1
    -DPC_ENABLE_CSRF=1
    ; The rig registers ~39 routes (dav + handlers + ws + sse + the messaging/energy interop endpoints); the
    ; default MAX_ROUTES (16) silently drops the overflow (server.on returns false), so raise it with headroom.
    -DMAX_ROUTES=48
    ; The rig binds 4 UDP listeners (CoAP 5683, SNMP 161, NTP 123, DNS 53); the default (2) makes the extras
    ; fail to bind - raise with headroom as UDP protocols accumulate.
    -DPC_MAX_UDP_LISTENERS=6
    -DPC_ENABLE_WEBDAV=1
    -DPC_ENABLE_COAP=1
    -DPC_ENABLE_COAP_OBSERVE=1
    -DPC_ENABLE_COAP_BLOCK=1
    -DPC_ENABLE_SNMP=1
    -DPC_ENABLE_OPCUA=1
    -DPC_ENABLE_MODBUS=1
    -DPC_ENABLE_WS_DEFLATE=1
    -DPC_ENABLE_MQTT=1
    -DPC_ENABLE_MTCONNECT=1
    -DPC_ENABLE_REDIS=1
    -DPC_ENABLE_FTP=1
    -DPC_ENABLE_SMTP=1
    -DPC_ENABLE_SYSLOG=1
    -DPC_ENABLE_NTP_SERVER=1
    -DPC_ENABLE_TIME_SOURCE=1
    -DPC_ENABLE_DNS_SERVER=1
    -DPC_ENABLE_NATS=1
    -DPC_ENABLE_STOMP=1
    -DPC_ENABLE_STATSD=1
    -DPC_ENABLE_JWT=1
    -DPC_ENABLE_NTS=1
    -DPC_ENABLE_DNP3=1
    -DPC_ENABLE_BACNET=1
    -DPC_ENABLE_S7COMM=1
    -DPC_ENABLE_IEC60870=1
    -DPC_ENABLE_GRAPHQL=1
    -DPC_ENABLE_GRPC_WEB=1
    -DPC_ENABLE_PROTOBUF=1
    -DPC_ENABLE_SPARKPLUG=1
    -DPC_ENABLE_SUNSPEC=1
    -DPC_ENABLE_XMPP=1
    -DPC_ENABLE_AMQP=1
    -DPC_ENABLE_WAMP=1
    -DPC_ENABLE_WS_CLIENT=1
    -DPC_ENABLE_SEP2=1
    -DPC_ENABLE_OPENADR=1
    -DSUNSPEC_BASE=100
    ; the SunSpec Common model (marker + 66-reg body + end) lives at holding reg 100, so the slave needs
    ; >= ~172 holding registers (default 64); the low regs stay for the plain-Modbus interop.
    -DPC_MODBUS_HOLDING_REGS=192

; Consume the library from the repo root (two levels up) without copying.
lib_deps = symlink://../..
; The full rig builds main.cpp; the slim TLS / SSH / SMB rigs (below) build their own main - exclude them here.
build_src_filter = +<*> -<main_tls.cpp> -<main_ssh.cpp> -<main_smb.cpp> -<main_cryptobench.cpp>

; Slim HTTPS rig (builds main_tls.cpp only): HTTP/80 + HTTPS/443, no other protocol stacks. With few statics
; the fixed 48 KB TLS arena (PC_TLS_ARENA_SIZE, static BSS, ZERO heap - no malloc) fits in internal DRAM, so
; TLS runs on the stock espressif32@6.13.0 (arduino 2.x) core with no PSRAM and no core rebuild. The full
; 20-protocol rig is DRAM-full and would need the PSRAM arena + a rebuilt arduino-cli core (rig_s3 stays HTTP).
; Build:  RIG_WIFI_SSID=... RIG_WIFI_PASS=... pio run -e rig_s3_tls
[env:rig_s3_tls]
extends = env:rig_s3
build_src_filter = +<main_tls.cpp>
build_flags =
    -Og
    -ggdb3
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWIFI_SSID=\"${sysenv.RIG_WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.RIG_WIFI_PASS}\"
    -DPC_ENABLE_DIAG=1
    -DPC_ENABLE_TLS=1
    ; Handshake wall-clock probe: tls.cpp records each handshake's device-CPU time (summed over the pumped
    ; mbedtls_ssl_handshake calls) vs its wall time, and this rig prints TLSHSBENCH lines - see
    ; performance_benching/FEATURE_PERFORMANCE.md "Device-CPU breakdown". Harmless if left on (a few globals + one printf).
    -DPC_TLS_HS_BENCH=1

; Slim SSH rig (builds main_ssh.cpp only): an SSH server on :22, Ed25519 host key from an embedded seed
; (no NVS), password auth. Runs on the STOCK espressif32@6.13.0 (arduino 2.x, mailbox lwIP) toolchain -
; the environment the SSH stack was developed on - to isolate an SSH KEX reset seen on the arduino-cli /
; IDF-5.5 (core-locking) build. SSH needs no PSRAM. Build: RIG_WIFI_SSID=... RIG_WIFI_PASS=... pio run -e rig_s3_ssh
[env:rig_s3_ssh]
extends = env:rig_s3
build_src_filter = +<main_ssh.cpp>
build_flags =
    -Og
    -ggdb3
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWIFI_SSID=\"${sysenv.RIG_WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.RIG_WIFI_PASS}\"
    -DPC_ENABLE_DIAG=1
    -DPC_ENABLE_SSH=1
    ; Wall-clock KEX bench: ssh_transport records each key exchange's device-side compute spans (ephemeral
    ; keygen + reply: shared secret, host-key sign, KDF) and this rig prints them - see
    ; performance_benching/FEATURE_PERFORMANCE.md "SSH KEX handshake wall-clock". Harmless if left on (a few globals).
    -DPC_SSH_KEX_BENCH=1

; Slim SMB2-client rig (builds main_smb.cpp only): the device is an SMB2 CLIENT driven by /smb/probe - the
; target for the SMB2 interop peer (vs a real samba) + the malicious-SMB2-server attack. DRAM-light (HTTP/80
; + the SMB client only), so it runs on the stock espressif32@6.13.0 core with no PSRAM.
; Build: RIG_WIFI_SSID=... RIG_WIFI_PASS=... pio run -e rig_s3_smb
[env:rig_s3_smb]
extends = env:rig_s3
build_src_filter = +<main_smb.cpp>
build_flags =
    -Og
    -ggdb3
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWIFI_SSID=\"${sysenv.RIG_WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.RIG_WIFI_PASS}\"
    -DPC_ENABLE_DIAG=1
    -DPC_ENABLE_SMB=1

; Crypto microbench rig (builds main_cryptobench.cpp only): no WiFi, no server - just times every
; self-implemented crypto primitive with the CCOUNT cycle counter and prints "CB " lines over USB-CDC.
; SSH + HTTP/3 (QUIC) + DTLS crypto compiled in so their primitives are callable; no PSRAM / arena needed
; (only the crypto functions are referenced, not the TLS/QUIC servers). Build:
;   pio run -e rig_s3_cryptobench -t upload --upload-port COM7
[env:rig_s3_cryptobench]
extends = env:rig_s3
build_src_filter = +<main_cryptobench.cpp>
build_flags =
    -Og
    -ggdb3
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DPC_ENABLE_SSH=1
    -DPC_ENABLE_DTLS=1 ; brings in quic_aead + quic_hkdf + tls13_kdf + dtls_record crypto (guard is HTTP3||DTLS)
    -DPC_ENABLE_PQC_KEX=1
    -DPC_WORKER_TASK_STACK=40960 ; >= PC_WORKER_STACK_SNTRUP_MIN (client) so the SSH sntrup761 guard passes; the bench runs its own 32 KB task
    -DPC_CRYPTO_BENCH=1
    -I../../test/fixtures/ssh_test_host_key ; RSA host-key fixture (ssh_test_host_key.h) - shared with build_p4_cryptobench.sh

; Physical (L1) link bring-up test - brings the 802.11 STA up via the reorganized physical/esp backend and
; prints "LT " egress lines. WiFi creds come from the environment (never committed), same as env:rig_s3:
;   RIG_WIFI_SSID='ssid' RIG_WIFI_PASS='pass' pio run -e rig_s3_linktest -t upload --upload-port COM7
[env:rig_s3_linktest]
extends = env:rig_s3
build_src_filter = +<main_linktest.cpp>
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DWIFI_SSID=\"${sysenv.RIG_WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.RIG_WIFI_PASS}\"
